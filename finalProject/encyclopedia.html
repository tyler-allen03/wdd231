<body>
    <div class="headNav">
        <header>
            <span>Five Nights at Freddy's Character Encyclopedia</span>
            <button id="navBTN" class="hamburger" aria-label="navigation"></button>
        </header>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="home.html">Home Page</a></li>
                <li class="current"><a href="encyclopedia.html">Encyclopedia</a></li>
                <li><a href="location.html">Locations</a></li>
            </ul>
        </nav>
    </div>
    <main>
        <h1>Character Encyclopedia</h1>
        <div id="characterContainer"></div>
        <section>
            <p>Did I miss anyone? Let me know here!</p>
            <button id="dialogBTN">Disclaimer and Reminder</button>
            <dialog id="disclaimBOX">
                <div></div>
                <button id="closeBTN">Close</button>
            </dialog>
            <form method="get" action="thankyou.html" id="mainForm">
                <fieldset>
                    <legend>Let me know who I missed</legend>
                    <label for="Fname">First Name*</label>
                    <input type="text" name="first" id="Fname" autocomplete="given-name" title="Your First Name"
                        required>

                    <label for="Lname">Last Name*</label>
                    <input type="text" name="last" id="Lname" autocomplete="family-name" title="Your Last Name"
                        required>

                    <label for="email">Email*</label>
                    <input type="email" name="email" id="email" autocomplete="email" title="Your Email"
                        placeholder="name@example.com" required>
                    <label for="missingAnimatronic">Missing Animatronic</label>
                    <textarea name="missingAnimatronic" id="missingAnimatronic" title="animatronic" required></textarea>

                </fieldset>
                <input type="submit" name="submit" id="submit" value="Let me know">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> | Tyler Allen | Missouri</p>
        <p id="lastModified"></p>
        <p>The video documentation can be found <a href="https://youtu.be/ct4iOAdInmI">here</a></p>
